name: ZoomInfo Health Check

# Proactive credit/entitlement monitoring (HADES-1d3) so the SYSTEM detects
# exhaustion before the operator sees blank leads (2026-06-15 incident).

on:
  schedule:
    # 11:00 UTC — deliberately ONE HOUR AHEAD of intent-poll (12:00 UTC).
    # Both were previously at 12:00, which defeated the point: GitHub gives no
    # ordering guarantee between workflows, so the check meant to flag a
    # credit/entitlement problem BEFORE the team pulls lists was racing the
    # pipeline it guards, and both hit the ZoomInfo API at the same instant.
    # tests/test_review_p3_tail2.py asserts the ordering (HADES-7qi).
    - cron: '0 11 * * *'
  workflow_dispatch: {}

concurrency:
  group: zoominfo-health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Check ZoomInfo health (alerts on its own when degraded)
        env:
          ZOOMINFO_CLIENT_ID: ${{ secrets.ZOOMINFO_CLIENT_ID }}
          ZOOMINFO_CLIENT_SECRET: ${{ secrets.ZOOMINFO_CLIENT_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python scripts/check_zoominfo_health.py

      - name: Notify on failure
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python scripts/notify_failure.py --workflow "ZoomInfo Health Check"
